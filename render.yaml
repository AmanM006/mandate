services:
  - type: web
    name: mandate-falkordb
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.mandate.api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: FALKORDB_HOST
        value: "REDACTED_FALKORDB_HOST"
      - key: FALKORDB_PORT
        value: "6379"
      - key: FALKORDB_USERNAME
        value: "falkordb"
      - key: FALKORDB_PASSWORD
        value: "REDACTED_PASSWORD"
      - key: GEMINI_API_KEY
        sync: false
